name: Bug report
description: Report a reproducible problem without attaching private documents.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Never include private files, document text, chat transcripts, secrets, or usernames.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Use fictional or minimal synthetic data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PrivateRAG AI version
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python, Ollama, and model versions
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized local logs
      description: Remove local paths and all document/chat content.

