name: Feature request
description: Propose a focused local-first improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What local workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible outcome and any privacy implications.
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: Does this require network access beyond configured Ollama?
      options:
        - "No"
        - "Yes — explain below"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs

