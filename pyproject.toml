[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "private-rag-ai"
version = "1.0.0"
description = "Local-first document question answering with Ollama"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "itstofi" }]
dependencies = [
  "alembic==1.18.5",
  "anyio==4.14.2",
  "chromadb==1.5.9",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "pydantic-settings==2.10.1",
  "pymupdf==1.26.3",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.51",
  "streamlit==1.60.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.0",
  "pip-audit==2.10.1",
  "pre-commit==4.2.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==6.2.1",
  "respx==0.22.0",
  "ruff==0.12.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "frontend", "scripts"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "alembic.ini"
"migrations" = "migrations"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["ollama: requires a running local Ollama installation"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
